spring:
  datasource:
    url: jdbc:h2:~/jpashop      # tcp://localhost 제거!
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
#        show_sql: true
        format_sql: true

  # 타임리프 기본 설정
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace #??? ?? 2.x, hibernate5